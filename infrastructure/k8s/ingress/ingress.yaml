# Install NGINX Ingress Controller first:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
#
# For Minikube:
#   minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcare-ingress
  namespace: healthcare
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Increase body size limit for file uploads (PDFs, images)
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # WebSocket support for telemedicine (Jitsi) and real-time notifications
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  ingressClassName: nginx
  rules:
    - host: healthcare.local # Change to your actual domain
      http:
        paths:
          # All API traffic routed through the gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3000
          # Frontend - catch all remaining paths
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
