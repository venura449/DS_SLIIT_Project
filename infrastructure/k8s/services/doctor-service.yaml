apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
  namespace: healthcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doctor-service
  template:
    metadata:
      labels:
        app: doctor-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.28
          command: ['sh', '-c', "until nc -z postgres-doctor 5432; do echo waiting for postgres-doctor; sleep 2; done"]
      containers:
        - name: doctor-service
          image: healthcare/doctor-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: service-urls
                  key: NODE_ENV
            - name: DB_HOST
              value: postgres-doctor
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: doctor_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
            - name: UPLOAD_DIR
              value: /uploads/doctor-verification
          volumeMounts:
            - name: uploads
              mountPath: /uploads/doctor-verification
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: doctor-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-service
  namespace: healthcare
spec:
  selector:
    app: doctor-service
  ports:
    - port: 3003
      targetPort: 3003
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: doctor-uploads-pvc
  namespace: healthcare
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
