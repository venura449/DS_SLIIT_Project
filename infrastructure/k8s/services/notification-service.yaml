apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: healthcare/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3007
          env:
            - name: PORT
              value: "3007"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: service-urls
                  key: NODE_ENV
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: service-urls
                  key: KAFKA_BROKER
            - name: ENABLE_SMS
              valueFrom:
                configMapKeyRef:
                  name: service-urls
                  key: ENABLE_SMS
            - name: SMSAPI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: smsapi-token
            - name: SMSAPI_SENDER_ID
              value: "SMSAPI Demo"
          readinessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: healthcare
spec:
  selector:
    app: notification-service
  ports:
    - port: 3007
      targetPort: 3007
